name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      # the build fetches clangd (about 120 MB) into public/wasm unless it is already there
      - uses: actions/cache@v6
        with:
          path: public/wasm
          key: clangd-wasm-${{ hashFiles('scripts/fetch-clangd.mjs') }}
      - run: yarn build
